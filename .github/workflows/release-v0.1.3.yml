name: Release v0.1.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.1.3.yml"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: f18cd02a5af6151fc7064d954569e06eb95ebb85

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Use pre-installed Temurin JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Install Maven
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y maven
          fi
          mvn -version

      - name: Install dependencies
        run: npm install

      - name: Build Keycloak theme JARs
        run: npm run build:keycloak

      - name: Generate checksums
        run: sha256sum dist_keycloak/*.jar > SHA256SUMS

      - name: Setup Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@v1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Keycloak image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/corelinkplatform/identity:v0.1.3
            ghcr.io/corelinkplatform/identity:latest
          labels: |
            org.opencontainers.image.source=https://github.com/CoreLinkPlatform/Identity
            org.opencontainers.image.version=v0.1.3
            org.opencontainers.image.title=CoreLink Identity
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.3 dist_keycloak/*.jar SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target f18cd02a5af6151fc7064d954569e06eb95ebb85 \
            --generate-notes \
            --title "CoreLink Identity v0.1.3"
