name: Maven Central v0.1.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/maven-central-v0.1.1.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      RELEASE_REF: v0.1.1
      PUBLISHING_TYPE: AUTOMATIC
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Use pre-installed Temurin JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Verify publishing tools
        run: |
          command -v gh
          command -v gpg
          command -v zip
          command -v python3
          command -v jar
          java -version

      - name: Download released Keycloak theme JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist_keycloak
          gh release download "$RELEASE_REF" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'keycloak-theme-for-kc-all-other-versions.jar' \
            --dir dist_keycloak
          test -s dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar
          sha256sum dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar

      - name: Import Maven Central signing key
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          test -n "$MAVEN_GPG_PRIVATE_KEY"
          printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Build signed Central bundle
        env:
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: bash scripts/build-central-bundle.sh "$RELEASE_REF"

      - name: Upload deployment to Maven Central
        id: central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          test -n "$CENTRAL_USERNAME"
          test -n "$CENTRAL_PASSWORD"
          VERSION="${RELEASE_REF#v}"
          AUTH="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          DEPLOYMENT_NAME="CoreLink Identity ${RELEASE_REF}"
          ENCODED_NAME="$(DEPLOYMENT_NAME="$DEPLOYMENT_NAME" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["DEPLOYMENT_NAME"], safe=""))')"
          UPLOAD_URL="https://central.sonatype.com/api/v1/publisher/upload?name=${ENCODED_NAME}&publishingType=${PUBLISHING_TYPE}"
          DEPLOYMENT_ID="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${AUTH}" \
            --form bundle=@central-bundle.zip \
            "$UPLOAD_URL")"
          echo "deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          echo "### Maven Central deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Coordinates: \`ir.coreplatform:identity-theme:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment ID: \`${DEPLOYMENT_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publishing type: \`${PUBLISHING_TYPE}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Check initial deployment status
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          DEPLOYMENT_ID: ${{ steps.central.outputs.deployment_id }}
        run: |
          AUTH="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${AUTH}" \
            "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}" \
            | tee central-status.json

      - name: Upload Central bundle diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maven-central-v0.1.1
          path: |
            central-bundle.zip
            central-status.json
          if-no-files-found: ignore
