name: Check Maven v1 publication

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    if: "${{ github.event.head_commit.message == 'maven-status-v1.0.0' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Maven Central publication
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          DEPLOYMENT_ID: 218ded06-0e82-43ac-b42b-1a885c3ecf08
        run: |
          set -euo pipefail
          AUTH="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          for i in $(seq 1 60); do
            RESPONSE="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${AUTH}" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}")"
            printf '%s\n' "$RESPONSE" | tee central-status.json
            STATE="$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deploymentState", "UNKNOWN"))')"
            echo "Deployment state: $STATE"
            case "$STATE" in
              PUBLISHED)
                exit 0
                ;;
              FAILED)
                echo "Maven Central deployment failed"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out before Maven Central reached PUBLISHED"
          exit 1
