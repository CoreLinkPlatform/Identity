name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: "${{ github.ref_type == 'tag' || github.event.head_commit.message == 'release-v1.0.0' }}"
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Resolve release tag and verify package version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            TAG_VERSION="${RELEASE_TAG#v}"
            test "${TAG_VERSION}" = "${PACKAGE_VERSION}"
          else
            RELEASE_TAG="v${PACKAGE_VERSION}"
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          echo "release tag: ${RELEASE_TAG}"

      - name: Use pre-installed Temurin JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Install Maven
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y maven
          fi
          mvn -version

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Restore and verify CoreLink extension overrides
        run: npm run prepare:extensions

      - name: Validate source and generated overrides
        run: npm run check

      - name: Build Keycloak theme JARs
        run: npm run build:keycloak

      - name: Verify expected release JARs
        run: |
          test -s dist_keycloak/keycloak-theme-for-kc-22-to-25.jar
          test -s dist_keycloak/keycloak-theme-for-kc-all-other-versions.jar

      - name: Generate checksums
        run: sha256sum dist_keycloak/*.jar > SHA256SUMS

      - name: Setup Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@v1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Keycloak image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/corelinkplatform/identity:${{ env.RELEASE_TAG }}
            ghcr.io/corelinkplatform/identity:latest
          labels: |
            org.opencontainers.image.source=https://github.com/CoreLinkPlatform/Identity
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.title=CoreLink Identity
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true

      - name: Create GitHub Release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" dist_keycloak/*.jar SHA256SUMS \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "CoreLink Identity $RELEASE_TAG"
          fi
