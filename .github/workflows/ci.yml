name: Identity CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: identity-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-theme:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Use pre-installed Temurin JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Ensure Maven is available
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends maven
          fi
          mvn -version

      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          npm install --prefer-offline --no-audit --no-fund 2>&1 | tee ci-install.log

      - name: Typecheck and web build
        id: check
        run: |
          set -o pipefail
          npm run check 2>&1 | tee ci-check.log

      - name: Build Keycloak theme
        id: theme
        run: |
          set -o pipefail
          npm run build:keycloak 2>&1 | tee ci-theme.log

      - name: Inspect Keycloak build output
        run: find dist_keycloak -maxdepth 2 -type f -print

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate production Docker image
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: corelink-identity:ci
          cache-from: type=gha,scope=identity-image-ci
          cache-to: type=gha,mode=min,scope=identity-image-ci

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: identity-ci-diagnostics
          path: |
            ci-install.log
            ci-check.log
            ci-theme.log
          if-no-files-found: ignore

      - name: Upload theme JAR
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: corelink-keycloak-theme
          path: dist_keycloak/*.jar
          if-no-files-found: error
