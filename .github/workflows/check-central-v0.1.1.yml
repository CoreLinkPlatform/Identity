name: Check Maven Central v0.1.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-central-v0.1.1.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Wait for Maven Central publication
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          DEPLOYMENT_ID: e83901d4-c082-43e4-859f-728050162f65
        run: |
          AUTH="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          for i in $(seq 1 60); do
            BODY="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${AUTH}" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}")"
            echo "$BODY" | tee central-status.json
            STATE="$(printf '%s' "$BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("deploymentState", ""))')"
            echo "State: $STATE"
            case "$STATE" in
              PUBLISHED) exit 0 ;;
              FAILED) exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for PUBLISHED" >&2
          exit 1
